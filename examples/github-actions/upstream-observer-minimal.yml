name: Upstream Radar — one repository

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub repository to observe
        required: false
        default: https://github.com/PlutoKeating/dsh-lark-bot
      ref:
        description: Branch or commit to observe
        required: false
        default: main
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: write

concurrency:
  group: upstream-radar-one-repository
  cancel-in-progress: false

env:
  OBSERVER_REPOSITORY_DEFAULT: https://github.com/PlutoKeating/dsh-lark-bot

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Observe the upstream repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVER_REPOSITORY_INPUT: ${{ inputs.repository }}
          OBSERVER_REF_INPUT: ${{ inputs.ref }}
          ISSUE_LOCATOR_LLM_BASE_URL: ${{ secrets.ISSUE_LOCATOR_LLM_BASE_URL }}
          ISSUE_LOCATOR_LLM_API_KEY: ${{ secrets.ISSUE_LOCATOR_LLM_API_KEY }}
          ISSUE_LOCATOR_LLM_MODEL: ${{ secrets.ISSUE_LOCATOR_LLM_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          repository="${OBSERVER_REPOSITORY_INPUT:-$OBSERVER_REPOSITORY_DEFAULT}"
          ref="${OBSERVER_REF_INPUT:-main}"
          report="$RUNNER_TEMP/upstream-radar-observer.md"
          json="$RUNNER_TEMP/upstream-radar-observer.json"
          llm_env_file="$RUNNER_TEMP/issue-locator.env"
          trap 'rm -f "$llm_env_file"' EXIT
          observe_args=(
            npx --yes upstream-radar@0.39.0 observe "$repository"
            --ref "$ref"
            --state observations.json
            --report "$report"
            --retry-pending
            --json
          )
          if [[ -n "${ISSUE_LOCATOR_LLM_BASE_URL:-}" && -n "${ISSUE_LOCATOR_LLM_API_KEY:-}" && -n "${ISSUE_LOCATOR_LLM_MODEL:-}" ]]; then
            umask 077
            {
              printf 'ISSUE_LOCATOR_LLM_BASE_URL=%s\n' "$ISSUE_LOCATOR_LLM_BASE_URL"
              printf 'ISSUE_LOCATOR_LLM_API_KEY=%s\n' "$ISSUE_LOCATOR_LLM_API_KEY"
              printf 'ISSUE_LOCATOR_LLM_MODEL=%s\n' "$ISSUE_LOCATOR_LLM_MODEL"
            } > "$llm_env_file"
            observe_args+=(--llm-env-file "$llm_env_file")
            echo 'Optional issue-locator model: configured'
          else
            echo 'Optional issue-locator model: not configured; static observation will still run'
          fi
          "${observe_args[@]}" | tee "$json"
          if [[ -s "$report" && -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the full observer report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-radar-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/upstream-radar-observer.md
            ${{ runner.temp }}/upstream-radar-observer.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Persist observation point
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f observations.json ]]; then
            echo 'observations.json was not produced; nothing to persist.'
            exit 0
          fi
          git config user.name 'upstream-radar[bot]'
          git config user.email 'upstream-radar[bot]@users.noreply.github.com'
          git add observations.json
          if git diff --cached --quiet; then
            echo 'No observation point changed; no commit created.'
            exit 0
          fi
          git commit -m 'chore: update upstream observation point [skip ci]'
          git push
