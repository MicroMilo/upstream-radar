name: DSH plugin upstream radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  dependency-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: MicroMilo/upstream-radar@v0.43.5
        with:
          config: examples/github-actions/consumer/upstream-radar.config.json
          fail-on: high
          # Optional pre-install artifact gate for the real plugin in this example:
          # inspect-package: dsh-cloudflare-browser-run@0.1.1
          # inspect-fail-on: review
          # Optional load-only compatibility matrix for the published plugin:
          # probe-package: dsh-cloudflare-browser-run@0.1.1
          # probe-dsh-versions: 0.1.0-rc.3,0.1.0-rc.6
