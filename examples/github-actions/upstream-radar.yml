name: Upstream Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  dependency-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: MicroMilo/upstream-radar@v0.33.4
        with:
          # The Action auto-detects one pnpm-lock.yaml or package-lock.json.
          fail-on: high
          fail-on-compatibility: breaking
          # threat-intel: true
          # Optional pre-install review of one exact published plugin:
          # inspect-package: dsh-cloudflare-browser-run@0.1.1
          # inspect-fail-on: review
