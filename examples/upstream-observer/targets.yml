schema: upstream-radar.observer-targets/v1alpha1
targets:
  # This repository is itself a DSH bundle, so the example can observe a real
  # public repository without inventing a plugin URL. Replace it with the
  # plugin repositories your team actually depends on.
  - id: upstream-radar
    ecosystem: dsh
    repository: MicroMilo/upstream-radar
    ref: main
    package: upstream-radar
    packagePath: package.json
    lockfile: pnpm-lock.yaml
    lockfileType: pnpm
