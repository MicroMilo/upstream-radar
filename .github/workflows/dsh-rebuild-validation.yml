name: DSH rebuild validation

on:
  push:
    branches: [codex/dsh-rebuild-validation]
  workflow_dispatch:
    inputs:
      execute_batch:
        description: Run the real isolated plugin batch, review its build gates, retry, and verify unchanged reuse
        type: boolean
        default: false
      adapter_matrix_json:
        description: Optional exact planner-produced adapter matrix for the normal isolated job path
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: dsh-rebuild-validation
  cancel-in-progress: false

jobs:
  repository-review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - name: Build and verify environment planning
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          node --test dist/test/*.test.js
      - name: Restore the previous durable review checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          RADAR_BRANCH: ${{ github.ref_name }}
          RADAR_RESTORE_SCRIPT: ${{ github.workspace }}/scripts/restore-dsh-review-checkpoint.mjs
        run: |
          set -euo pipefail
          node "$RADAR_RESTORE_SCRIPT" "$GITHUB_REPOSITORY" "$RADAR_BRANCH" validation-output
      - name: Collect current upstream versions and repository facts
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p validation-output
          node dist/src/cli.js observe examples/dsh/rebuild-batch/targets.yml \
            --state validation-output/observations.json \
            --report validation-output/observer-report.md --json \
            > validation-output/observer-report.json
      - name: Infer author environments from fresh evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_LOCATOR_LLM_BASE_URL: ${{ secrets.ISSUE_LOCATOR_LLM_BASE_URL }}
          ISSUE_LOCATOR_LLM_API_KEY: ${{ secrets.ISSUE_LOCATOR_LLM_API_KEY }}
          ISSUE_LOCATOR_LLM_MODEL: ${{ secrets.ISSUE_LOCATOR_LLM_MODEL }}
        run: |
          node scripts/plan-dsh-environment-recommendations.mjs \
            examples/dsh/rebuild-batch/install-targets.json \
            validation-output/observations.json \
            validation-output/recommendations.json \
            validation-output/recommendations.md \
            validation-output/candidates.json \
            > validation-output/review-summary.json
      - name: Verify unchanged repository evidence reuses the completed reviews
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_LOCATOR_LLM_BASE_URL: ${{ secrets.ISSUE_LOCATOR_LLM_BASE_URL }}
          ISSUE_LOCATOR_LLM_API_KEY: ${{ secrets.ISSUE_LOCATOR_LLM_API_KEY }}
          ISSUE_LOCATOR_LLM_MODEL: ${{ secrets.ISSUE_LOCATOR_LLM_MODEL }}
        run: |
          node scripts/plan-dsh-environment-recommendations.mjs \
            examples/dsh/rebuild-batch/install-targets.json \
            validation-output/observations.json \
            validation-output/recommendations.json \
            validation-output/recommendations.md \
            validation-output/repeat-candidates.json \
            > validation-output/review-repeat-summary.json
          node --input-type=module -e 'import {readFile} from "node:fs/promises"; const result=JSON.parse(await readFile("validation-output/review-repeat-summary.json","utf8")); if(result.attempted !== 0 || result.failed !== 0) throw new Error("Unchanged evidence did not reuse the completed reviews")'
      - name: Form exact install plans without executing target code
        if: ${{ !cancelled() }}
        run: |
          node scripts/write-dsh-install-plan.mjs \
            examples/dsh/rebuild-batch/install-targets.json \
            validation-output/observations.json \
            validation-output/observer-report.json \
            validation-output/compatibility-ledger.json \
            examples/dsh/rebuild-batch/agent-plans.json \
            validation-output/recommendations.json \
            > validation-output/install-plan.json
      - name: Review exact build gates from the completed isolated batch
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_LOCATOR_LLM_BASE_URL: ${{ secrets.ISSUE_LOCATOR_LLM_BASE_URL }}
          ISSUE_LOCATOR_LLM_API_KEY: ${{ secrets.ISSUE_LOCATOR_LLM_API_KEY }}
          ISSUE_LOCATOR_LLM_MODEL: ${{ secrets.ISSUE_LOCATOR_LLM_MODEL }}
        run: |
          node scripts/plan-dsh-headless-agent.mjs \
            examples/dsh/rebuild-batch/install-targets.json \
            examples/dsh/awesome-observer/cohort.json \
            validation-output/observations.json \
            examples/dsh/rebuild-validation/2026-09-14/system-batch/compatibility-ledger.json \
            validation-output/build-plans.json \
            validation-output/build-plans.md \
            > validation-output/build-review-summary.json
      - name: Prepare the disposable batch executor
        if: ${{ inputs.execute_batch && !cancelled() }}
        run: |
          node --input-type=module -e 'import {writeFile} from "node:fs/promises"; await writeFile("validation-executor.json", JSON.stringify({dockerContext:"default",architecture:"x64",timeoutSeconds:180,maxTasks:100}))'
      - name: Run the isolated batch against current repository intent
        if: ${{ inputs.execute_batch && !cancelled() }}
        run: |
          batch_exit=0
          node scripts/run-dsh-compatibility-batch.mjs examples/dsh/rebuild-batch/install-targets.json \
            validation-output batch-output validation-executor.json --execute > batch-first.log 2>&1 || batch_exit=$?
          if [[ "$batch_exit" != 0 && "$batch_exit" != 2 ]]; then tail -80 batch-first.log; exit "$batch_exit"; fi
          cp batch-output/summary.json batch-first-summary.json
          test -z "$(docker ps --quiet --filter label=upstream-radar.task)"
      - name: Review build gates produced by this batch
        if: ${{ inputs.execute_batch && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_LOCATOR_LLM_BASE_URL: ${{ secrets.ISSUE_LOCATOR_LLM_BASE_URL }}
          ISSUE_LOCATOR_LLM_API_KEY: ${{ secrets.ISSUE_LOCATOR_LLM_API_KEY }}
          ISSUE_LOCATOR_LLM_MODEL: ${{ secrets.ISSUE_LOCATOR_LLM_MODEL }}
        run: |
          test -z "$(docker ps --quiet --filter label=upstream-radar.task)"
          node scripts/plan-dsh-headless-agent.mjs \
            examples/dsh/rebuild-batch/install-targets.json examples/dsh/awesome-observer/cohort.json \
            validation-output/observations.json batch-output/compatibility-ledger.json \
            validation-output/build-plans.json validation-output/build-plans.md \
            > validation-output/batch-build-review-summary.json
      - name: Review host and surface build failures produced by this batch
        if: ${{ inputs.execute_batch && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_LOCATOR_LLM_BASE_URL: ${{ secrets.ISSUE_LOCATOR_LLM_BASE_URL }}
          ISSUE_LOCATOR_LLM_API_KEY: ${{ secrets.ISSUE_LOCATOR_LLM_API_KEY }}
          ISSUE_LOCATOR_LLM_MODEL: ${{ secrets.ISSUE_LOCATOR_LLM_MODEL }}
        run: |
          test -z "$(docker ps --quiet --filter label=upstream-radar.task)"
          node scripts/plan-dsh-surface-agent.mjs \
            examples/dsh/rebuild-batch/install-targets.json examples/dsh/awesome-observer/cohort.json \
            validation-output/observations.json batch-output/compatibility-ledger.json batch-output/surface-ledger.json \
            validation-output/surface-build-plans.json validation-output/surface-build-plans.md \
            > validation-output/batch-surface-review-summary.json
      - name: Retry the batch with its own exact build decisions
        if: ${{ inputs.execute_batch && !cancelled() }}
        run: |
          batch_exit=0
          node scripts/run-dsh-compatibility-batch.mjs examples/dsh/rebuild-batch/install-targets.json \
            validation-output batch-output validation-executor.json --execute > batch-retry.log 2>&1 || batch_exit=$?
          if [[ "$batch_exit" != 0 && "$batch_exit" != 2 ]]; then tail -80 batch-retry.log; exit "$batch_exit"; fi
          cp batch-output/summary.json batch-retry-summary.json
          test -z "$(docker ps --quiet --filter label=upstream-radar.task)"
      - name: Verify the completed batch does not execute unchanged cells
        if: ${{ inputs.execute_batch && !cancelled() }}
        run: |
          batch_exit=0
          node scripts/run-dsh-compatibility-batch.mjs examples/dsh/rebuild-batch/install-targets.json \
            validation-output batch-output validation-executor.json --execute > batch-unchanged.log 2>&1 || batch_exit=$?
          if [[ "$batch_exit" != 0 && "$batch_exit" != 2 ]]; then tail -80 batch-unchanged.log; exit "$batch_exit"; fi
          test -z "$(docker ps --quiet --filter label=upstream-radar.task)"
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises'
          const json = async path => JSON.parse(await readFile(path, 'utf8'))
          const summary = await json('batch-output/summary.json')
          const state = await json('batch-output/state.json')
          if (summary.executed !== 0 || summary.failedTasks.length || summary.deferredTaskKeys.length
            || summary.orphanedRunningTasks.length || state.tasks.some(task => task.status === 'running')
            || summary.nextNativePlan.matrix.include.length || summary.nextSurfacePlan.matrix.include.length
            || summary.nextAdapterPlan.matrix.include.length) throw new Error('the batch has not reached unchanged reusable evidence')
          if (summary.nextSurfacePlan.blocked.length || summary.nextAdapterPlan.blocked.length) throw new Error('an intended execution profile remains uncollected')
          if (state.nativeLedger.entries.some(entry => entry.result === 'build-approval-required')) throw new Error('dependency build gates remain unresolved')
          for (const scope of summary.authorScopes) {
            if (!scope.recommendation || !state.nativeLedger.entries.some(entry => entry.targetId === scope.id)) throw new Error('a plugin lacks current repository or execution evidence')
            for (const adapter of scope.recommendation.executionProfiles.filter(kind => kind === 'sdk' || kind === 'acp')) {
              if (!state.adapterLedger.entries.some(entry => entry.cell.targetId === scope.id && entry.cell.adapter === adapter)) throw new Error('an intended adapter was omitted')
            }
          }
          if (state.adapterLedger.entries.some(entry => entry.report.result === 'unknown')) throw new Error('independent adapter evidence is incomplete')
          console.log(JSON.stringify({collectionClosed:true,compatibilityPass:false,nativeCells:summary.nativeCells,
            surfaceCells:summary.surfaceCells,adapterCells:summary.adapterCells,remainingCoverageGaps:summary.unimplementedChecks}))
          NODE
      - name: Join this batch to the maintained catalog feed
        if: ${{ inputs.execute_batch && success() }}
        run: |
          node scripts/write-dsh-directory-feed.mjs \
            examples/dsh/rebuild-batch/catalog-cohort.json examples/dsh/rebuild-batch/install-targets.json \
            batch-output/compatibility-ledger.json batch-output/catalog-feed.json batch-output/catalog-feed.md \
            validation-output/observations.json batch-output/surface-ledger.json \
            validation-output/recommendations.json batch-output/adapter-ledger.json validation-output/build-plans.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          const json = async path => JSON.parse(await readFile(path, 'utf8'))
          const cohort = await json('examples/dsh/rebuild-batch/catalog-cohort.json')
          const targets = await json('examples/dsh/rebuild-batch/install-targets.json')
          const state = await json('batch-output/state.json')
          const feed = await json('batch-output/catalog-feed.json')
          const catalogIds = new Set(cohort.plugins.map(plugin => plugin.id))
          const excludedIds = cohort.selection.notInCatalog.map(plugin => plugin.targetId)
          assert.deepEqual(targets.plugins.map(plugin => plugin.observerTargetId).sort(), [...catalogIds, ...excludedIds].sort())
          assert.deepEqual(feed.plugins.map(plugin => plugin.id).sort(), [...catalogIds].sort())
          const includedTargets = new Set(targets.plugins.filter(plugin => catalogIds.has(plugin.observerTargetId)).map(plugin => plugin.id))
          const native = state.nativeLedger.entries.filter(entry => includedTargets.has(entry.targetId))
          const nativeIds = new Set(native.map(entry => entry.caseId))
          const surfaces = state.surfaceLedger.entries.filter(entry => nativeIds.has(entry.sourceCaseId))
          const adapters = state.adapterLedger.entries.filter(entry => includedTargets.has(entry.cell.targetId))
          const cells = feed.plugins.flatMap(plugin => plugin.cells)
          assert.equal(cells.filter(cell => cell.evidenceSource === 'compatibility-ledger').length, native.length)
          assert.equal(cells.filter(cell => cell.evidenceSource === 'surface-ledger').length, surfaces.length)
          assert.equal(cells.filter(cell => cell.evidenceSource === 'adapter-ledger').length, adapters.length)
          for (const entry of adapters) {
            const cell = cells.find(cell => cell.caseId === entry.cell.id)
            assert.equal(cell.radarResult, entry.report.result)
            assert.equal(cell.evidenceScope, 'adapter-initialize-only')
            assert.deepEqual(cell.coverageGaps, entry.report.coverageGaps)
            assert.equal(cell.dependencyGraphDigests.profile, entry.report.profileGraph.digest)
            assert.equal(cell.dependencyGraphDigests.application, entry.report.applicationGraph.digest)
          }
          console.log(JSON.stringify({ batchPlugins: targets.plugins.length, catalogPlugins: feed.plugins.length,
            outsideCatalogButStillInBatch: excludedIds, native: native.length, surfaces: surfaces.length, adapters: adapters.length }))
          NODE
      - name: Collect an earlier real Context repository revision
        if: ${{ inputs.execute_batch && success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Real upstream history preceding the README update, not a fabricated
          # manifest. Preserve the completed batch and fetch through the normal observer.
          node scripts/verify-dsh-input-change.mjs prepare validation-output batch-output \
            input-change-before 33fd7ae6801d892ddbee7b76a964a4b2c6ff0416
          node dist/src/cli.js observe input-change-before/observer-targets.json \
            --state input-change-before/review/observations.json \
            --report input-change-before/review/observer-report.md --json \
            > input-change-before/review/observer-report.json
          node scripts/verify-dsh-input-change.mjs observation input-change-before
      - name: Review the earlier real repository evidence
        if: ${{ inputs.execute_batch && success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_LOCATOR_LLM_BASE_URL: ${{ secrets.ISSUE_LOCATOR_LLM_BASE_URL }}
          ISSUE_LOCATOR_LLM_API_KEY: ${{ secrets.ISSUE_LOCATOR_LLM_API_KEY }}
          ISSUE_LOCATOR_LLM_MODEL: ${{ secrets.ISSUE_LOCATOR_LLM_MODEL }}
        run: |
          node scripts/plan-dsh-environment-recommendations.mjs \
            examples/dsh/rebuild-batch/install-targets.json input-change-before/review/observations.json \
            input-change-before/review/recommendations.json input-change-before/review/recommendations.md \
            > input-change-before/review/review-summary.json
          node scripts/verify-dsh-input-change.mjs review input-change-before
      - name: Execute only the earlier Context environment
        if: ${{ inputs.execute_batch && success() }}
        run: |
          batch_exit=0
          node scripts/run-dsh-compatibility-batch.mjs examples/dsh/rebuild-batch/install-targets.json \
            input-change-before/review input-change-before/batch validation-executor.json --execute \
            > input-change-before/execution.log 2>&1 || batch_exit=$?
          if [[ "$batch_exit" != 0 && "$batch_exit" != 2 ]]; then tail -80 input-change-before/execution.log; exit "$batch_exit"; fi
          test -z "$(docker ps --quiet --filter label=upstream-radar.task)"
          node scripts/verify-dsh-input-change.mjs execution input-change-before
      - name: Collect the forward Context repository update
        if: ${{ inputs.execute_batch && success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          current_commit=$(node --input-type=module -e 'import {readFile} from "node:fs/promises"; console.log(JSON.parse(await readFile("validation-output/observations.json","utf8")).targets["dsh-context"].source.commit)')
          node scripts/verify-dsh-input-change.mjs prepare input-change-before/review input-change-before/batch \
            input-change-after "$current_commit"
          node dist/src/cli.js observe input-change-after/observer-targets.json \
            --state input-change-after/review/observations.json \
            --report input-change-after/review/observer-report.md --json \
            > input-change-after/review/observer-report.json
          node scripts/verify-dsh-input-change.mjs observation input-change-after
      - name: Review only the changed repository after the forward update
        if: ${{ inputs.execute_batch && success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_LOCATOR_LLM_BASE_URL: ${{ secrets.ISSUE_LOCATOR_LLM_BASE_URL }}
          ISSUE_LOCATOR_LLM_API_KEY: ${{ secrets.ISSUE_LOCATOR_LLM_API_KEY }}
          ISSUE_LOCATOR_LLM_MODEL: ${{ secrets.ISSUE_LOCATOR_LLM_MODEL }}
        run: |
          node scripts/plan-dsh-environment-recommendations.mjs \
            examples/dsh/rebuild-batch/install-targets.json input-change-after/review/observations.json \
            input-change-after/review/recommendations.json input-change-after/review/recommendations.md \
            > input-change-after/review/review-summary.json
          node scripts/verify-dsh-input-change.mjs review input-change-after
      - name: Execute only changed Context cells and verify unchanged reuse again
        if: ${{ inputs.execute_batch && success() }}
        run: |
          batch_exit=0
          node scripts/run-dsh-compatibility-batch.mjs examples/dsh/rebuild-batch/install-targets.json \
            input-change-after/review input-change-after/batch validation-executor.json --execute \
            > input-change-after/execution.log 2>&1 || batch_exit=$?
          if [[ "$batch_exit" != 0 && "$batch_exit" != 2 ]]; then tail -80 input-change-after/execution.log; exit "$batch_exit"; fi
          test -z "$(docker ps --quiet --filter label=upstream-radar.task)"
          node scripts/verify-dsh-input-change.mjs execution input-change-after
          batch_exit=0
          node scripts/run-dsh-compatibility-batch.mjs examples/dsh/rebuild-batch/install-targets.json \
            input-change-after/review input-change-after/batch validation-executor.json --execute \
            > input-change-after/unchanged.log 2>&1 || batch_exit=$?
          if [[ "$batch_exit" != 0 && "$batch_exit" != 2 ]]; then tail -80 input-change-after/unchanged.log; exit "$batch_exit"; fi
          test -z "$(docker ps --quiet --filter label=upstream-radar.task)"
          node scripts/verify-dsh-input-change.mjs unchanged input-change-after
      - name: Preserve the real batch and its intermediate checkpoints
        if: ${{ always() && inputs.execute_batch }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsh-rebuild-system-batch
          path: |
            batch-output
            batch-*.log
            batch-*-summary.json
            validation-executor.json
            input-change-before
            input-change-after
          if-no-files-found: error
          retention-days: 14
      - name: Preserve evidence even when a stage is incomplete
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsh-rebuild-review
          path: validation-output
          if-no-files-found: error
          retention-days: 14

  adapter-case-validation:
    needs: repository-review
    if: github.event_name == 'workflow_dispatch' && inputs.adapter_matrix_json != ''
    name: Adapter ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.adapter_matrix_json) }}
    permissions:
      contents: read
    uses: ./.github/workflows/observe-dsh-plugin-adapter.yml
    with:
      case_json: ${{ toJSON(matrix) }}
