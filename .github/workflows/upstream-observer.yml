name: Upstream Radar observer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the full observer, retry durable Agent tasks, or reuse evidence for the headless loop
        required: true
        default: full
        type: choice
        options:
          - full
          - agent-retry
          - headless-agent
  schedule:
    # The observer is intentionally periodic: durable state makes the loop
    # restartable, while the report stays quiet when nothing meaningful changed.
    - cron: '23 6 * * *'

permissions:
  contents: write

# Only one run may read/write observations.json at a time. A later run must
# wait for the earlier run so an observation point is never lost.
concurrency:
  group: upstream-radar-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run_install_observation: ${{ steps.install-plan.outputs.run }}
      install_dsh_version: ${{ steps.install-plan.outputs.dsh_version }}
      install_matrix: ${{ steps.install-plan.outputs.matrix }}
      observer_exit: ${{ steps.observe.outputs.exit }}
    steps:
      - name: Check out the observer and its targets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A queued run may start after an earlier observer has advanced the
          # durable state. Read the latest serialized observation point rather
          # than the commit that happened to trigger this run.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Build the checked-out Radar
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build downstream reverse dependency index
        if: inputs.mode != 'headless-agent' && inputs.mode != 'agent-retry'
        run: |
          # Use the checked-in index generated from the first-batch corpus of
          # real DSH plugin reports. Refresh it intentionally with
          # `pnpm run refresh:dsh-batch`; skipped targets remain visible in the
          # corpus summary instead of becoming false clean results.
          cp examples/dsh/first-batch/reverse-dependency-index.json \
            "$RUNNER_TEMP/reverse-dependency-index.json"

      - name: Observe upstream changes
        if: inputs.mode != 'headless-agent'
        id: observe
        # A source outage is degraded evidence, not permission to discard the
        # successful targets from this cycle. Preserve the exit code, continue
        # planning/retesting those targets, then surface the outage after the
        # dynamic jobs have finished.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVER_REPORT: ${{ runner.temp }}/upstream-radar-observer.md
          OBSERVER_JSON: ${{ runner.temp }}/upstream-radar-observer.json
          ISSUE_LOCATOR_LLM_BASE_URL: ${{ secrets.ISSUE_LOCATOR_LLM_BASE_URL }}
          ISSUE_LOCATOR_LLM_API_KEY: ${{ secrets.ISSUE_LOCATOR_LLM_API_KEY }}
          ISSUE_LOCATOR_LLM_MODEL: ${{ secrets.ISSUE_LOCATOR_LLM_MODEL }}
          OBSERVER_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set +e
          llm_env_file="$RUNNER_TEMP/issue-locator.env"
          trap 'rm -f "$llm_env_file"' EXIT
          observe_args=(
            node dist/src/cli.js observe
            examples/upstream-observer/targets.yml
            --state observations.json
            --report "$OBSERVER_REPORT"
            --json
          )
          if [[ "$OBSERVER_MODE" == 'agent-retry' ]]; then
            observe_args+=(--retry-pending-only)
          else
            observe_args+=(
              --reverse-index "$RUNNER_TEMP/reverse-dependency-index.json"
              --retry-pending
            )
          fi
          if [[ -n "${ISSUE_LOCATOR_LLM_BASE_URL:-}" && -n "${ISSUE_LOCATOR_LLM_API_KEY:-}" && -n "${ISSUE_LOCATOR_LLM_MODEL:-}" ]]; then
            umask 077
            {
              printf 'ISSUE_LOCATOR_LLM_BASE_URL=%s\n' "$ISSUE_LOCATOR_LLM_BASE_URL"
              printf 'ISSUE_LOCATOR_LLM_API_KEY=%s\n' "$ISSUE_LOCATOR_LLM_API_KEY"
              printf 'ISSUE_LOCATOR_LLM_MODEL=%s\n' "$ISSUE_LOCATOR_LLM_MODEL"
            } > "$llm_env_file"
            observe_args+=(--llm-env-file "$llm_env_file")
            echo 'Optional DSH Agent analysis: configured'
          else
            echo 'Optional DSH Agent analysis: not configured; static observation remains active'
          fi
          "${observe_args[@]}" | tee "$OBSERVER_JSON"
          observer_exit=${PIPESTATUS[0]}
          set -e
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" && -s "$OBSERVER_REPORT" ]]; then
            cat "$OBSERVER_REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "exit=$observer_exit" >> "$GITHUB_OUTPUT"
          exit "$observer_exit"

      - name: Reuse current evidence for the headless Agent loop
        if: inputs.mode == 'headless-agent'
        env:
          OBSERVER_JSON: ${{ runner.temp }}/upstream-radar-observer.json
        run: |
          node -e "require('node:fs').writeFileSync(process.env.OBSERVER_JSON, JSON.stringify({ changes: [] }))"

      # Repository prose is untrusted model input. This job never executes a
      # target package; it emits only a bounded headless retry contract. The
      # later reusable workflow receives that contract but no model secret.
      - name: Let the Agent plan bounded headless follow-ups
        if: inputs.mode != 'agent-retry'
        id: headless-agent-plan
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_LOCATOR_LLM_BASE_URL: ${{ secrets.ISSUE_LOCATOR_LLM_BASE_URL }}
          ISSUE_LOCATOR_LLM_API_KEY: ${{ secrets.ISSUE_LOCATOR_LLM_API_KEY }}
          ISSUE_LOCATOR_LLM_MODEL: ${{ secrets.ISSUE_LOCATOR_LLM_MODEL }}
        run: |
          node scripts/plan-dsh-headless-agent.mjs \
            examples/dsh/install-observer/targets.json \
            examples/dsh/awesome-observer/cohort.json \
            observations.json \
            compatibility-ledger.json \
            examples/dsh/install-observer/agent-plans.json \
            examples/dsh/install-observer/agent-plans.md

      - name: Reconcile the current DSH compatibility matrix
        id: install-plan
        env:
          OBSERVER_JSON: ${{ runner.temp }}/upstream-radar-observer.json
        run: |
          node scripts/write-dsh-install-plan.mjs \
            examples/dsh/install-observer/targets.json \
            observations.json \
            "$OBSERVER_JSON" \
            compatibility-ledger.json \
            examples/dsh/install-observer/agent-plans.json

      # State is written even when an upstream source or Agent call fails.
      # Successful plans remain bound to exact bytes/runtime; failed calls have
      # no static fallback and are retried by the next scheduled run.
      - name: Persist observation and Agent planning state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f observations.json ]]; then
            echo 'observations.json was not produced; nothing to persist.'
            exit 0
          fi
          # observations.json may advance even when a later source fails and no
          # dynamic matrix can run. Keep the directory feed in the same commit
          # so default-branch consumers and PR merge refs never see stale
          # distribution coordinates paired with the new observation point.
          if ! git diff --quiet -- observations.json; then
            node scripts/write-dsh-directory-feed.mjs \
              examples/dsh/awesome-observer/cohort.json \
              examples/dsh/install-observer/targets.json \
              compatibility-ledger.json \
              feeds/dsh-plugin-compatibility.json \
              feeds/dsh-plugin-compatibility.md \
              observations.json
          fi
          git config user.name 'upstream-radar[bot]'
          git config user.email 'upstream-radar[bot]@users.noreply.github.com'
          git add -- \
            observations.json \
            examples/dsh/install-observer/agent-plans.json \
            examples/dsh/install-observer/agent-plans.md \
            feeds/dsh-plugin-compatibility.json \
            feeds/dsh-plugin-compatibility.md
          if git diff --cached --quiet; then
            echo 'No observation point changed; no commit created.'
            exit 0
          fi
          git commit -m 'chore: update upstream observation point [skip ci]'
          # A maintainer may push while this long-running observer is reading
          # external sources. Replay the bounded evidence commit on the latest
          # branch; a real state conflict still fails instead of being forced.
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push

  # Every selected matrix entry gets a fresh GitHub-hosted VM. The reusable
  # workflow adds a restricted container and never receives the model key.
  # Selection is reconciliation-driven: missing, stale, or invalidated cells
  # run even when neither package published a new version.
  install-observation:
    needs: observe
    if: needs.observe.outputs.run_install_observation == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.observe.outputs.install_matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/observe-dsh-plugin-install.yml
    with:
      plugin: ${{ matrix.plugin }}
      dsh_version: ${{ needs.observe.outputs.install_dsh_version }}
      case_id: ${{ matrix.id }}
      node_major: ${{ matrix.nodeMajor }}
      timeout_seconds: '180'
      allow_builds: ${{ matrix.allowedBuilds }}
      accept_bounded_unknown: true

  # Dynamic reports are useful only if they become durable, comparable
  # evidence. This job accepts reports only when their exact case, plugin,
  # DSH version, runtime major, and build-approval policy match the static
  # matrix that scheduled them. Missing reports remain unsatisfied and will be
  # selected again on the next daily reconciliation.
  reconcile-install-observations:
    needs: [observe, install-observation]
    if: always() && needs.observe.result == 'success' && needs.observe.outputs.run_install_observation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out the latest durable observation state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Build the checked-out Radar
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Materialize the exact scheduled matrix
        env:
          INSTALL_MATRIX: ${{ needs.observe.outputs.install_matrix }}
          INSTALL_MATRIX_PATH: ${{ runner.temp }}/upstream-radar-install-matrix.json
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          const matrix = JSON.parse(process.env.INSTALL_MATRIX ?? '')
          await writeFile(process.env.INSTALL_MATRIX_PATH, `${JSON.stringify(matrix, null, 2)}\n`, 'utf8')
          NODE

      - name: Download isolated observation reports
        id: download-reports
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: upstream-radar-install-*-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-radar-install-reports

      - name: Reconcile dynamic evidence into the compatibility ledger
        id: ledger
        # The merger writes every accepted cell before returning non-zero for
        # missing/rejected reports. Keep processing that bounded partial
        # result, persist it, then surface the incomplete run at the end. This
        # prevents one transient runner failure from discarding every other
        # successful observation while preserving a visible retry signal.
        continue-on-error: true
        env:
          INSTALL_MATRIX_PATH: ${{ runner.temp }}/upstream-radar-install-matrix.json
          INSTALL_REPORTS_PATH: ${{ runner.temp }}/upstream-radar-install-reports
          LEDGER_REPORT: ${{ runner.temp }}/upstream-radar-compatibility-ledger.md
          COMPATIBILITY_IR: compatibility-ir.json
          COMPATIBILITY_REVERSE_INDEX: compatibility-reverse-index.json
        run: |
          node scripts/merge-dsh-compatibility-ledger.mjs \
            compatibility-ledger.json \
            "$INSTALL_MATRIX_PATH" \
            "$INSTALL_REPORTS_PATH" \
            "$LEDGER_REPORT" \
            "$COMPATIBILITY_IR" \
            "$COMPATIBILITY_REVERSE_INDEX"
          cat "$LEDGER_REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish directory-consumable compatibility evidence
        run: |
          node scripts/write-dsh-directory-feed.mjs \
            examples/dsh/awesome-observer/cohort.json \
            examples/dsh/install-observer/targets.json \
            compatibility-ledger.json \
            feeds/dsh-plugin-compatibility.json \
            feeds/dsh-plugin-compatibility.md \
            observations.json

      - name: Keep compatibility evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-radar-compatibility-ledger-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/upstream-radar-compatibility-ledger.md
            compatibility-ledger.json
            compatibility-ir.json
            compatibility-reverse-index.json
            feeds/dsh-plugin-compatibility.json
            feeds/dsh-plugin-compatibility.md
          if-no-files-found: warn
          retention-days: 30

      # The consumer is part of the transaction: a ledger that cannot create,
      # update or close its managed incident is not persisted as delivered.
      # The next scheduled run will therefore reproduce and retry the cell.
      - name: Create, update or close compatibility incidents
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-dsh-compatibility-issues.mjs compatibility-ledger.json

      - name: Persist compatibility evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f compatibility-ledger.json || ! -f compatibility-ir.json || ! -f compatibility-reverse-index.json || ! -f feeds/dsh-plugin-compatibility.json || ! -f feeds/dsh-plugin-compatibility.md ]]; then
            echo 'complete compatibility evidence was not produced; nothing to persist.'
            exit 0
          fi
          git config user.name 'upstream-radar[bot]'
          git config user.email 'upstream-radar[bot]@users.noreply.github.com'
          git add -- compatibility-ledger.json compatibility-ir.json compatibility-reverse-index.json feeds/dsh-plugin-compatibility.json feeds/dsh-plugin-compatibility.md
          if git diff --cached --quiet; then
            echo 'No compatibility evidence changed; no commit created.'
            exit 0
          fi
          git commit -m 'chore: update DSH compatibility evidence [skip ci]'
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push

      - name: Fail after persisting incomplete reconciliation
        if: always() && steps.ledger.outcome == 'failure'
        shell: bash
        env:
          RADAR_ACCEPTED: ${{ steps.ledger.outputs.accepted }}
          RADAR_MISSING: ${{ steps.ledger.outputs.missing }}
          RADAR_REJECTED: ${{ steps.ledger.outputs.rejected }}
        run: |
          echo "Compatibility evidence was partially persisted: accepted=${RADAR_ACCEPTED:-unknown}, missing=${RADAR_MISSING:-unknown}, rejected=${RADAR_REJECTED:-unknown}."
          echo 'The incomplete cells remain unsatisfied and will be selected by the next reconciliation run.'
          exit 1

  # Surface work is planned after the headless ledger settles, so Web/TUI
  # evidence always binds to the latest exact plugin artifact and DSH release.
  plan-surface-observations:
    needs: [observe, reconcile-install-observations]
    if: always() && needs.observe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run: ${{ steps.surface-plan.outputs.run }}
      matrix: ${{ steps.surface-plan.outputs.matrix }}
      blocked: ${{ steps.surface-plan.outputs.blocked }}
    steps:
      - name: Check out the latest compatibility ledger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.3.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Build the checked-out Radar
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Reconcile Web and TUI cells from exact headless evidence
        id: surface-plan
        run: |
          node scripts/write-dsh-surface-plan.mjs \
            examples/dsh/surface-observer/targets.json \
            compatibility-ledger.json \
            surface-ledger.json | tee "$RUNNER_TEMP/upstream-radar-surface-plan.json"
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs'
          const plan = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/upstream-radar-surface-plan.json', 'utf8'))
          const lines = ['## DSH execution-plane plan', '', `- Scheduled: ${plan.matrix.include.length}`, `- Blocked by source evidence: ${plan.blocked.length}`]
          for (const item of plan.matrix.include) lines.push(`- \`${item.id}\`: \`${item.plugin}\` → DSH \`${item.dshVersion}\` → \`${item.plane}\` (${item.reasons.join(', ')})`)
          for (const item of plan.blocked) lines.push(`- Blocked \`${item.id}\`: ${item.reason}`)
          process.stdout.write(lines.join('\n') + '\n')
          NODE

  # Every selected plane runs in a fresh VM and restricted container. The
  # reusable workflow receives no repository or model secrets.
  surface-observation:
    needs: plan-surface-observations
    # A no-op headless reconciliation is a skipped transitive ancestor. Use an
    # explicit status check so GitHub does not suppress a surface-only refresh.
    if: always() && needs.plan-surface-observations.result == 'success' && needs.plan-surface-observations.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-surface-observations.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/observe-dsh-plugin-surface.yml
    with:
      plugin: ${{ matrix.plugin }}
      dsh_version: ${{ matrix.dshVersion }}
      case_id: ${{ matrix.id }}
      source_case_id: ${{ matrix.sourceCaseId }}
      source_fingerprint: ${{ matrix.sourceFingerprint }}
      contract_fingerprint: ${{ matrix.contractFingerprint }}
      plane: ${{ matrix.plane }}
      profile: ${{ matrix.profile }}
      runtime_id: ${{ matrix.runtimeId }}
      artifact_sha256: ${{ matrix.artifactSha256 }}
      allow_builds: ${{ matrix.allowedBuilds }}
      node_major: ${{ matrix.nodeMajor }}
      timeout_seconds: '300'

  reconcile-surface-observations:
    needs: [plan-surface-observations, surface-observation]
    if: always() && needs.plan-surface-observations.result == 'success' && needs.plan-surface-observations.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the latest durable ledgers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.3.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Build the checked-out Radar
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Materialize the exact scheduled surface matrix
        env:
          SURFACE_MATRIX: ${{ needs.plan-surface-observations.outputs.matrix }}
          SURFACE_MATRIX_PATH: ${{ runner.temp }}/upstream-radar-surface-matrix.json
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          const matrix = JSON.parse(process.env.SURFACE_MATRIX ?? '')
          await writeFile(process.env.SURFACE_MATRIX_PATH, `${JSON.stringify(matrix, null, 2)}\n`, 'utf8')
          NODE
      - name: Download isolated browser and PTY reports
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: upstream-radar-surface-*-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-radar-surface-reports
      - name: Reconcile plane-specific evidence into the surface ledger
        id: surface-ledger
        continue-on-error: true
        env:
          SURFACE_MATRIX_PATH: ${{ runner.temp }}/upstream-radar-surface-matrix.json
          SURFACE_REPORTS_PATH: ${{ runner.temp }}/upstream-radar-surface-reports
          SURFACE_LEDGER_REPORT: ${{ runner.temp }}/upstream-radar-surface-ledger.md
        run: |
          node scripts/merge-dsh-surface-ledger.mjs \
            surface-ledger.json \
            "$SURFACE_MATRIX_PATH" \
            "$SURFACE_REPORTS_PATH" \
            "$SURFACE_LEDGER_REPORT" \
            surface-ir.json
          cat "$SURFACE_LEDGER_REPORT" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep execution-plane evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-radar-surface-ledger-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/upstream-radar-surface-ledger.md
            surface-ledger.json
            surface-ir.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist execution-plane evidence
        shell: bash
        run: |
          set -euo pipefail
          [[ -f surface-ledger.json && -f surface-ir.json ]] || { echo 'complete surface evidence was not produced; nothing to persist.'; exit 0; }
          git config user.name 'upstream-radar[bot]'
          git config user.email 'upstream-radar[bot]@users.noreply.github.com'
          git add -- surface-ledger.json surface-ir.json
          if git diff --cached --quiet; then
            echo 'No execution-plane evidence changed; no commit created.'
            exit 0
          fi
          git commit -m 'chore: update DSH execution-plane evidence [skip ci]'
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push
      - name: Fail after persisting incomplete surface reconciliation
        if: always() && steps.surface-ledger.outcome == 'failure'
        shell: bash
        env:
          RADAR_ACCEPTED: ${{ steps.surface-ledger.outputs.accepted }}
          RADAR_MISSING: ${{ steps.surface-ledger.outputs.missing }}
          RADAR_REJECTED: ${{ steps.surface-ledger.outputs.rejected }}
        run: |
          echo "Surface evidence was partially persisted: accepted=${RADAR_ACCEPTED:-unknown}, missing=${RADAR_MISSING:-unknown}, rejected=${RADAR_REJECTED:-unknown}."
          echo 'Incomplete cells remain unsatisfied and will be selected by the next scheduled run.'
          exit 1

  # Keep a partial source outage or failed explicit Agent retry visible without
  # letting it discard successful work from the same observer cycle.
  observer-final-health:
    needs: [observe, install-observation, reconcile-install-observations, plan-surface-observations, surface-observation, reconcile-surface-observations]
    if: always() && needs.observe.outputs.observer_exit != '' && needs.observe.outputs.observer_exit != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Surface the deferred observer failure after downstream work
        env:
          OBSERVER_EXIT: ${{ needs.observe.outputs.observer_exit }}
        run: |
          echo "The observer returned exit code ${OBSERVER_EXIT}; successful source observations, Agent conclusions, and isolated retests were still persisted."
          exit 1
