name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'const version = require("./package.json").version; if (process.env.RELEASE_TAG !== `v${version}`) throw new Error(`release ${process.env.RELEASE_TAG} does not match package v${version}`)'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run try:dsh
      - run: pnpm run showcase:dsh-probe
      - run: pnpm run showcase:dsh-runtime
      - run: pnpm run showcase:dsh-host-alert
      - run: pnpm run showcase:quickstart
      - run: pnpm run showcase:setup-start
      - run: pnpm run release:check
      - run: pnpm pack --pack-destination /tmp
      - name: Install OIDC-capable npm CLI
        run: npm install --global --ignore-scripts npm@11.18.0
      - name: Publish with npm trusted publishing
        run: npm publish --access public
